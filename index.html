<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قیمت لحظه‌ای جفت‌ارزها</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1030; --panel:#251845; --line:#3a2a63; --text:#f3edff; --muted:#a99bcf;
  --gold:#ffc94d; --up:#38d39f; --down:#ff6b81;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:18px;margin:0;font-weight:800}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down)}
.dot.on{background:var(--up)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero .sym{color:var(--muted);font-size:14px}
.hero .price{font-size:40px;font-weight:800;color:var(--gold);direction:ltr;text-align:right;letter-spacing:.5px;line-height:1.2}
.hero .row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.hero .row b{color:var(--text);direction:ltr;display:inline-block}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected=true]{background:var(--gold);color:#2a1d00;border-color:var(--gold);font-weight:600}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;height:340px;position:relative}
canvas{width:100%;height:100%;display:block}
iframe{width:100%;height:100%;border:0;display:block}
.hidden{display:none}
.pairs{display:grid;gap:8px}
.pair{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;cursor:pointer;text-align:right;width:100%}
.pair[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pair .n{font-weight:600}
.pair .r{direction:ltr;text-align:left}
.pair .p{font-weight:600}
.pair .c{font-size:12px}
.flash-up{animation:fu .5s} .flash-down{animation:fd .5s}
@keyframes fu{from{background:rgba(56,211,159,.25)}to{background:var(--panel)}}
@keyframes fd{from{background:rgba(255,107,129,.25)}to{background:var(--panel)}}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:14px;line-height:1.8}
.err{color:var(--down);font-size:12px;margin:0 0 10px;display:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flash-up,.flash-down{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>قیمت لحظه‌ای جفت‌ارزها</h1>
    <div class="status"><span id="user"></span><span class="dot" id="dot"></span><span id="st">در حال اتصال…</span></div>
  </header>

  <div class="hero">
    <div class="sym" id="hsym">BTC / USDT</div>
    <div class="price" id="hprice">—</div>
    <div class="row">
      <span>تغییر ۲۴ساعته: <b id="hchg" class="chg">—</b></span>
      <span>بیشترین: <b id="hhigh">—</b></span>
      <span>کمترین: <b id="hlow">—</b></span>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabSimple" aria-selected="true">نمودار ساده</button>
    <button class="tab" role="tab" id="tabTV" aria-selected="false">چارت TradingView</button>
  </div>
  <p class="err" id="err"></p>

  <div class="chartbox">
    <canvas id="cv"></canvas>
    <div id="tvwrap" class="hidden" style="height:100%"></div>
  </div>

  <div class="pairs" id="pairs"></div>

  <p class="note">قیمت‌ها از Binance به‌صورت زنده دریافت می‌شوند. این برنامه توصیه مالی نیست.</p>
</div>

<script>
const PAIRS = [
  {s:'BTCUSDT', n:'BTC / USDT', d:2},
  {s:'ETHUSDT', n:'ETH / USDT', d:2},
  {s:'BNBUSDT', n:'BNB / USDT', d:2},
  {s:'SOLUSDT', n:'SOL / USDT', d:2},
  {s:'XRPUSDT', n:'XRP / USDT', d:4},
  {s:'DOGEUSDT', n:'DOGE / USDT', d:5},
  {s:'ETHBTC', n:'ETH / BTC', d:6}
];
const state = {}; // symbol -> {price, open, high, low}
let current = PAIRS[0].s;
let series = [];
let ws, tvLoaded = '';

const $ = id => document.getElementById(id);
const fmt = (v,d) => v==null ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pinfo = s => PAIRS.find(p=>p.s===s);

// ---- pair list
const list = $('pairs');
PAIRS.forEach(p=>{
  const b = document.createElement('button');
  b.className='pair'; b.dataset.s=p.s; b.setAttribute('aria-pressed', p.s===current);
  b.innerHTML = `<span class="n">${p.n}</span><span class="r"><div class="p" id="p-${p.s}">—</div><div class="c chg" id="c-${p.s}">—</div></span>`;
  b.onclick = ()=>select(p.s);
  list.appendChild(b);
});

function select(s){
  current = s;
  document.querySelectorAll('.pair').forEach(b=>b.setAttribute('aria-pressed', b.dataset.s===s));
  series = [];
  renderHero(); loadHistory(); draw();
  if(!$('tvwrap').classList.contains('hidden')) loadTV();
}

function renderHero(){
  const p = pinfo(current), st = state[current];
  $('hsym').textContent = p.n;
  if(!st){ $('hprice').textContent='—'; return; }
  $('hprice').textContent = fmt(st.price,p.d);
  const ch = (st.price-st.open)/st.open*100;
  const el = $('hchg'); el.textContent = (ch>=0?'+':'')+ch.toFixed(2)+'%';
  el.className = 'chg '+(ch>=0?'up':'down');
  $('hhigh').textContent = fmt(st.high,p.d); $('hlow').textContent = fmt(st.low,p.d);
}

// ---- live prices (WebSocket, with REST polling fallback)
function setStatus(on,t){ $('dot').className='dot'+(on?' on':''); $('st').textContent=t; }

function onTick(sym, c, o, h, l){
  const p = pinfo(sym); if(!p) return;
  const prev = state[sym] ? state[sym].price : null;
  state[sym] = {price:+c, open:+o, high:+h, low:+l};
  const pe = $('p-'+sym), ce = $('c-'+sym);
  pe.textContent = fmt(c,p.d);
  const ch = (c-o)/o*100;
  ce.textContent = (ch>=0?'+':'')+ch.toFixed(2)+'%';
  ce.className = 'c chg '+(ch>=0?'up':'down');
  if(prev!=null && prev!==+c){
    const row = pe.closest('.pair'); const cls = +c>prev?'flash-up':'flash-down';
    row.classList.remove('flash-up','flash-down'); void row.offsetWidth; row.classList.add(cls);
  }
  if(sym===current){
    renderHero();
    series.push(+c); if(series.length>300) series.shift();
    draw();
  }
}

let pollTimer;
function connect(){
  const streams = PAIRS.map(p=>p.s.toLowerCase()+'@miniTicker').join('/');
  try{ ws = new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams); }catch(e){ startPolling(); return; }
  ws.onopen = ()=>{ setStatus(true,'زنده'); clearInterval(pollTimer); hideErr(); };
  ws.onmessage = ev=>{
    const d = JSON.parse(ev.data).data; if(!d) return;
    onTick(d.s, d.c, d.o, d.h, d.l);
  };
  ws.onclose = ()=>{ setStatus(false,'قطع شد، تلاش مجدد…'); startPolling(); setTimeout(connect,4000); };
  ws.onerror = ()=>{ ws.close(); };
}
function startPolling(){
  clearInterval(pollTimer);
  const poll = async ()=>{
    try{
      const syms = encodeURIComponent(JSON.stringify(PAIRS.map(p=>p.s)));
      const r = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols='+syms);
      const a = await r.json();
      a.forEach(d=>onTick(d.symbol, d.lastPrice, d.openPrice, d.highPrice, d.lowPrice));
      setStatus(true,'زنده (به‌روزرسانی هر ۳ ثانیه)'); hideErr();
    }catch(e){ showErr('اتصال به منبع قیمت برقرار نشد. اینترنت را بررسی کنید.'); }
  };
  poll(); pollTimer = setInterval(poll,3000);
}
function showErr(t){ const e=$('err'); e.textContent=t; e.style.display='block'; }
function hideErr(){ $('err').style.display='none'; }

// ---- history for simple chart
async function loadHistory(){
  const sym = current;
  try{
    const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=1m&limit=120`);
    const k = await r.json();
    if(sym!==current) return;
    series = k.map(x=>+x[4]);
    draw();
  }catch(e){}
}

// ---- simple canvas line chart
function draw(){
  const cv = $('cv'); if(cv.classList.contains('hidden')) return;
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h = cv.clientHeight; if(!w||!h) return;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,w,h);
  const cs = getComputedStyle(document.documentElement);
  const line=cs.getPropertyValue('--line').trim(), muted=cs.getPropertyValue('--muted').trim();
  if(series.length<2){ g.fillStyle=muted; g.font='14px Vazirmatn,Tahoma'; g.textAlign='center'; g.fillText('در حال بارگذاری نمودار…',w/2,h/2); return; }
  const padL=8, padR=64, padT=16, padB=16;
  let min=Math.min(...series), max=Math.max(...series);
  if(min===max){ min-=1; max+=1; }
  const span=max-min; min-=span*.08; max+=span*.08;
  const X=i=>padL+(w-padL-padR)*i/(series.length-1);
  const Y=v=>padT+(h-padT-padB)*(1-(v-min)/(max-min));
  const d = pinfo(current).d;
  g.strokeStyle=line; g.lineWidth=1; g.fillStyle=muted; g.font='11px Tahoma'; g.textAlign='left';
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, y=Y(v);
    g.beginPath(); g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke();
    g.fillText(fmt(v,d>4?4:Math.min(d,4)),w-padR+6,y+4);
  }
  const up = series[series.length-1]>=series[0];
  const col = up ? cs.getPropertyValue('--up').trim() : cs.getPropertyValue('--down').trim();
  const grad = g.createLinearGradient(0,padT,0,h-padB);
  grad.addColorStop(0,col+'55'); grad.addColorStop(1,col+'00');
  g.beginPath(); series.forEach((v,i)=> i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));
  g.lineTo(X(series.length-1),h-padB); g.lineTo(X(0),h-padB); g.closePath(); g.fillStyle=grad; g.fill();
  g.beginPath(); series.forEach((v,i)=> i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));
  g.strokeStyle=col; g.lineWidth=2; g.lineJoin='round'; g.stroke();
  const lx=X(series.length-1), ly=Y(series[series.length-1]);
  g.beginPath(); g.arc(lx,ly,4,0,7); g.fillStyle=col; g.fill();
}
window.addEventListener('resize',draw);

// ---- TradingView chart (embedded widget)
function loadTV(){
  const key = current;
  const box = $('tvwrap');
  const sym = encodeURIComponent('BINANCE:'+current);
  box.innerHTML = `<iframe title="TradingView" allowfullscreen src="https://s.tradingview.com/widgetembed/?symbol=${sym}&interval=15&theme=dark&style=1&timezone=Etc%2FUTC&locale=en&hide_side_toolbar=1&allow_symbol_change=0&save_image=0&withdateranges=1"></iframe>`;
  tvLoaded = key;
}
function showTab(tv){
  $('tabSimple').setAttribute('aria-selected', !tv);
  $('tabTV').setAttribute('aria-selected', tv);
  $('cv').classList.toggle('hidden', tv);
  $('tvwrap').classList.toggle('hidden', !tv);
  if(tv){ if(tvLoaded!==current) loadTV(); } else draw();
}
$('tabSimple').onclick = ()=>showTab(false);
$('tabTV').onclick = ()=>showTab(true);

// ---- Pi Network sign-in
let sessionToken = null; // kept in memory only
function onIncompletePaymentFound(payment){ /* no payments in this app */ }
async function piSignIn(){
  try{
    if(!window.Pi) return; // opened outside Pi Browser: prices still work
    await Pi.init({ version: "2.0" });
    const auth = await Pi.authenticate(["username"], onIncompletePaymentFound);
    const r = await fetch('https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({accessToken:auth.accessToken})
    });
    if(!r.ok) throw new Error('login '+r.status);
    const data = await r.json();
    sessionToken = data.sessionToken;
    $('user').textContent = '@'+data.user.username;
  }catch(e){ console.error('Pi sign-in failed', e); }
}

// ---- start
renderHero(); loadHistory(); connect(); piSignIn();
</script>
</body>
</html>
